# Name of your application. Used to uniquely configure containers.
service: roomies

# Container image on Docker Hub (your-user/app-name).
image: rrivadeneirag/roomies

# Deploy to these servers.
servers:
  web:
    - 157.230.182.71          # <-- reemplaza por la IP pública del droplet

# HTTPS automático (Let's Encrypt) para el dominio público.
proxy:
  ssl: true
  host: roomies-cb-ed-rr.duckdns.org

# Where you keep your container images (Docker Hub by default).
registry:
  username: rrivadeneirag
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - ROOMIES_DATABASE_PASSWORD
  clear:
    # Procesa los jobs (ej. el email de notificación) dentro de Puma.
    SOLID_QUEUE_IN_PUMA: true
    # Host de la base de datos: el contenedor accesorio "roomies-db".
    DB_HOST: roomies-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Volumen persistente para los archivos subidos (Active Storage).
volumes:
  - "roomies_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder (build amd64 even on an Apple Silicon Mac).
builder:
  arch: amd64

# PostgreSQL en el mismo droplet, como contenedor accesorio.
accessories:
  db:
    image: postgres:16
    host: 157.230.182.71        # <-- la MISMA IP del droplet
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: roomies
        POSTGRES_DB: roomies_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
